[workspace]
members = ["crates/k9rs_app", "crates/k9rs_cli", "crates/k9rs_config", "crates/k9rs_daemon", "crates/k9rs_theme", "crates/k9rs_ui", "crates/k9rs_kube", "crates/k9rs_mux", "crates/k9rs_proto", "crates/k9rs_session", "crates/k9rs_util"]

# One place per dependency. A member crate writes `dep.workspace = true`, so a
# version bump is a single edit and two crates cannot drift onto different
# versions of the same library.
[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
regex = "1"
tokio = { version = "1", features = ["full"] }
unicode-segmentation = "1"
unicode-width = "0.2"
anyhow = "1"
bincode = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
tokio-yamux = "0.3"
dashmap = "6"
futures = "0.3"
k8s-openapi = { version = "0.24", features = ["latest"] }
kube = { version = "0.98", features = ["client", "runtime", "derive", "ws"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream", "serde"] }
ratatui = "0.29"
k9rs_app = { path = "crates/k9rs_app" }
k9rs_cli = { path = "crates/k9rs_cli" }
k9rs_config = { path = "crates/k9rs_config" }
k9rs_daemon = { path = "crates/k9rs_daemon" }
k9rs_theme = { path = "crates/k9rs_theme" }
k9rs_ui = { path = "crates/k9rs_ui" }
k9rs_kube = { path = "crates/k9rs_kube" }
k9rs_mux = { path = "crates/k9rs_mux" }
k9rs_proto = { path = "crates/k9rs_proto" }
k9rs_session = { path = "crates/k9rs_session" }
k9rs_util = { path = "crates/k9rs_util" }

# One lint config for every member. `unreachable_pub` is the one that makes
# the facade doctrine structural instead of a count: it is noise in a binary
# (where nothing is reachable from outside) and exactly right in a library,
# which is why it found only 21 items while this was one bin crate. As each
# crate comes out, it starts reporting the `pub` items that are not actually
# API — and `pub` is what suppresses `dead_code`, the way five dead items have
# already hidden from clippy here.
[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[package]
name = "k9rs"
version = "0.1.0"
edition = "2021"
description = "A fast Kubernetes TUI, inspired by k9s, built in Rust"

[dependencies]
# The binary's own dependencies, and nothing else. Every library this used to
# list — kube-rs, k8s-openapi, http, serde, serde_json, bincode, tokio-stream,
# tokio-yamux, dashmap, chrono, regex, the unicode crates, tracing — now
# belongs to whichever crate actually uses it, so `cargo tree -p <crate>` is
# an honest statement about that layer. (`syntect` was listed here and used
# nowhere at all; it is gone.)
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
futures.workspace = true
# `poll(POLLHUP)` on stdin: the pty-hangup check in `stdin_hung_up`.
libc.workspace = true
ratatui.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

# The layering, bottom to top. `main` names only what it touches directly:
# the ones it does not (`k9rs_daemon`, `k9rs_mux`) arrive transitively
# through the crates that do. `k9rs_kube` is named for ONE call —
# `daemon_config::load_from_home()`, which belongs at the process entry point
# alongside the overlay load and nowhere else.
k9rs_app = { workspace = true }
k9rs_cli = { workspace = true }
k9rs_config = { workspace = true }
k9rs_kube = { workspace = true }
k9rs_proto = { workspace = true }
k9rs_session = { workspace = true }
k9rs_theme = { workspace = true }
k9rs_ui = { workspace = true }
k9rs_util = { workspace = true }

# No `[dev-dependencies]`. There is nothing to test in `src/main.rs` — the
# `testing` features and tokio's `test-util` are declared by the crates whose
# tests actually use them. They lived here while this was one package, and
# leaving them would have kept feature unification switching `test-util` on
# for the whole workspace, so `cargo test -p k9rs_kube` would pass for a
# reason that had nothing to do with `k9rs_kube`.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
