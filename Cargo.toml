[workspace]
members = ["crates/k9rs_daemon", "crates/k9rs_kube", "crates/k9rs_mux", "crates/k9rs_proto", "crates/k9rs_util"]

# One place per dependency. A member crate writes `dep.workspace = true`, so a
# version bump is a single edit and two crates cannot drift onto different
# versions of the same library.
[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
regex = "1"
tokio = { version = "1", features = ["full"] }
unicode-segmentation = "1"
unicode-width = "0.2"
anyhow = "1"
bincode = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_yaml = "0.9"
tracing = "0.1"
tokio-stream = "0.1"
tokio-yamux = "0.3"
dashmap = "6"
futures = "0.3"
k8s-openapi = { version = "0.24", features = ["latest"] }
kube = { version = "0.98", features = ["client", "runtime", "derive", "ws"] }
serde_json = "1"
k9rs_daemon = { path = "crates/k9rs_daemon" }
k9rs_kube = { path = "crates/k9rs_kube" }
k9rs_mux = { path = "crates/k9rs_mux" }
k9rs_proto = { path = "crates/k9rs_proto" }
k9rs_util = { path = "crates/k9rs_util" }

# One lint config for every member. `unreachable_pub` is the one that makes
# the facade doctrine structural instead of a count: it is noise in a binary
# (where nothing is reachable from outside) and exactly right in a library,
# which is why it found only 21 items while this was one bin crate. As each
# crate comes out, it starts reporting the `pub` items that are not actually
# API — and `pub` is what suppresses `dead_code`, the way five dead items have
# already hidden from clippy here.
[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[package]
name = "k9rs"
version = "0.1.0"
edition = "2021"
description = "A fast Kubernetes TUI, inspired by k9s, built in Rust"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream", "serde"] }

# Kubernetes
# `ws` for the native websocket port-forward (Api::portforward) — no kubectl
# subprocess in the forward path.
kube = { version = "0.98", features = ["client", "runtime", "derive", "ws"] }
k8s-openapi = { version = "0.24", features = ["latest"] }
http = "1"

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
bincode = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
unicode-width = "0.2"
# Same segmentation ratatui uses to decide what occupies a cell — see
# `ui::widgets::log_view::cluster_width`.
unicode-segmentation = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
libc = "0.2"
dashmap = "6"

# The first extracted crate. `main.rs` re-exports it as `util`, so the ~33
# existing `crate::util::…` paths keep resolving and nothing else changed.
k9rs_daemon = { workspace = true }
k9rs_kube = { workspace = true }
k9rs_mux = { workspace = true }
k9rs_proto = { workspace = true }
k9rs_util = { workspace = true }

# Multiplexer: per-subscription substreams over the single Unix socket
# between TUI and daemon. We hide this behind `src/kube/mux/` so swapping
# implementations later (libp2p/yamux, hand-rolled, etc.) touches only that
# module — the rest of the codebase only sees `MuxedConnection`/`MuxedStream`.
tokio-yamux = "0.3"

[dev-dependencies]
k9rs_kube = { workspace = true, features = ["testing"] }
# `test-util` is deliberately NOT part of tokio's `full`, and it is what
# provides `#[tokio::test(start_paused = true)]`. One test asserts a path
# whose backstop IS a two-second timeout; without a pausable clock, waiting
# that out puts a two-second floor under the entire suite. Dev-only, so
# `cargo build` never sees it, and enabling it changes nothing unless a test
# actually pauses the clock.
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
